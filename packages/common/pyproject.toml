[project]
name = "common"
version = "0.1.0"
description = "앱들이 공유하는 범용 계약: 프로세스 종료 코드와 API 에러 응답 형식"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
