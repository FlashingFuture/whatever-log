[project]
name = "chrome"
version = "0.1.0"
description = "Chrome 프로필 폴더 위치와 URL 도메인 처리 — recorder(수집)와 hub(아이콘)가 함께 쓰는 범용 규칙"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chrome"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
