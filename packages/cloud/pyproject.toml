[project]
name = "cloud"
version = "0.1.0"
description = "서버(보고서)와 통신하는 쪽의 경계: 로그인 상태와 토큰 저장 인터페이스. 로그인이 없어도 기록·집계·목표는 돌아가야 하므로, 서버를 부르는 코드만 이 패키지에 의존한다"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
