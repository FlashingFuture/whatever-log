[project]
name = "aggregation"
version = "0.1.0"
description = "recorder.db에 쌓인 틱 데이터를 화면에 보여줄 단위로 집계한다"
requires-python = ">=3.14"
dependencies = [
    "recorder",
]

[tool.uv.sources]
recorder = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregation"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
