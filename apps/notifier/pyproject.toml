[project]
name = "notifier"
version = "0.1.0"
description = "목표의 알림 규칙(마감 시각까지 하지 않았으면)을 확인해 Windows 시스템 알림을 띄우는 백그라운드 에이전트. 판단과 알림은 모두 이 PC 안에서 끝난다"
requires-python = ">=3.14"
dependencies = [
    "aggregation",
    "common",
    "goals",
    "recorder",
    "supervision",
]

[tool.uv.sources]
aggregation = { workspace = true }
common = { workspace = true }
goals = { workspace = true }
recorder = { workspace = true }
supervision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
