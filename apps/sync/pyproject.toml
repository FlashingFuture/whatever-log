[project]
name = "sync"
version = "0.1.0"
description = "로그인한 사용자의 목표와 날짜별 달성 분을 서버와 맞추는 동기화 에이전트. hub와 별개의 프로세스로 혼자 돈다"
requires-python = ">=3.14"
dependencies = [
    "cloud",
    "common",
    "goals",
    "goalsync",
    "recorder",
    "supervision",
]

[tool.uv.sources]
cloud = { workspace = true }
common = { workspace = true }
goals = { workspace = true }
goalsync = { workspace = true }
recorder = { workspace = true }
supervision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
