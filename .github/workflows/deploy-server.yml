# 서버(apps/server, Cloudflare Workers + D1)를 운영에 배포한다. 절차와 규칙은 docs/deploy.md.
# - main에 서버 코드가 들어오면 돈다. Actions 화면에서 직접 실행할 수도 있다("Use workflow from"으로 브랜치를 고른다 — 병합 전에 서버를
#   먼저 올려야 할 때. 어느 브랜치·커밋이었는지 이 실행 기록에 남는다).
# - `production` 환경의 승인자가 승인해야 시작한다(저장소 설정 → Environments). 언제·어느 커밋을·누가 승인해 배포했는지 그 환경의 기록에 남는다.
# - 순서: 검사 → D1 마이그레이션(--remote) → Worker 배포 → /version이 이 커밋을 돌려주는지 확인. 마이그레이션은 추가만 한다(배포 사이에
#   이전 Worker가 새 DB에서 돌아가야 한다).
# - 운영 비밀(Google 클라이언트 비밀, Resend 키)은 Cloudflare에만 있다. 여기서 쓰는 것은 배포 권한만 가진 Cloudflare API 토큰뿐이다.
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나씩, 진행 중인 배포를 끊지 않는다(마이그레이션 도중에 끊기면 안 된다).
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://whatever-log-server.whateverlog.workers.dev/version
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_URL: https://whatever-log-server.whateverlog.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 의존성
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 서버 검사(타입·테스트)
        working-directory: apps/server
        run: |
          pnpm exec tsc
          pnpm test

      - name: D1 마이그레이션(운영)
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Worker 배포
        working-directory: apps/server
        run: |
          pnpm exec wrangler deploy \
            --var "COMMIT_SHA:${GITHUB_SHA}" \
            --message "${GITHUB_SHA::12} ${GITHUB_REF_NAME} (actions run ${GITHUB_RUN_ID})"

      # 새 버전이 실제로 응답하는지 본다(퍼지는 데 잠깐 걸릴 수 있어 몇 번 다시 본다).
      - name: 배포 확인(/version의 커밋)
        run: |
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -A whatever-log-deploy-check "${SERVER_URL}/version" || true)"
            echo "시도 ${attempt}: ${body}"
            if echo "${body}" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::운영 서버가 이 커밋(${GITHUB_SHA})을 돌려주지 않습니다."
          exit 1
