# 태그(v1.0.0, v1.0.0-beta.1 …)를 푸시하면 릴리스 번들을 만들어 GitHub Release에 올린다.
# 하이픈이 든 태그(v1.0.0-beta.1)는 "시험 버전(pre-release)"으로 표시된다. 절차는 docs/packaging.md의 "릴리스 만들기".
# 올리기 전에 만든 zip을 사용자처럼 풀어 install.cmd로 설치해 보고, 실패하면 Release를 만들지 않는다
# (v1.0.0-beta.1은 테스트가 다 통과했는데도 install.cmd가 실행되지 않는 채로 나갔다).
# 번들에는 파이썬이 들어 있어서 사용자 PC에 uv·파이썬이 필요 없다. 설치 시험은 그것을 확인하려고 PATH를 비운 채로 한다
# (러너에는 uv·파이썬이 깔려 있어서, 그냥 돌리면 번들이 그것에 기대도 통과해 버린다).
# Actions 화면에서 직접 실행(workflow_dispatch)하면 번들 만들기와 설치 시험까지만 하고 Release는 올리지 않는다 — 태그 전 예행연습용.
# 시작할 때 운영 서버의 API 계약이 이 앱의 요구 이상인지 확인한다(서버가 뒤처진 채로 앱이 나가지 않게, docs/deploy.md).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 기본은 읽기 권한뿐이다. Release를 올리는 publish job만 쓰기 권한을 받는다.
permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # 토큰을 .git/config에 남기지 않는다(프로젝트 코드가 돈다)

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # 운영 서버가 이 앱이 요구하는 API 계약을 갖췄는지 본다 — 서버를 먼저, 앱은 그다음(docs/deploy.md).
      # 태그(실제 출시)에서는 서버가 뒤처졌으면 멈춘다. 수동 실행(예행연습)에서는 알리기만 한다.
      - name: 운영 서버 API 계약 확인
        continue-on-error: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          uv python install 3.14
          uv run python scripts/check_server_api.py

      - name: 번들 만들기(태그가 VERSION과 같을 때만)
        id: build
        shell: bash
        run: |
          corepack enable
          uv python install 3.14
          tag_check=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then tag_check=(--expect-tag "${GITHUB_REF_NAME}"); fi
          out="$(uv run python scripts/build_release.py "${tag_check[@]}")"
          echo "$out"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "archive=$(echo "$out" | grep '\.zip$' | tail -n1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$out" | sed -n 's/^sha256: //p')" >> "$GITHUB_OUTPUT"

      - name: 설치 시험 — 번들 풀기
        id: unpack
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "install-check"
          Expand-Archive -LiteralPath $env:ARCHIVE -DestinationPath $dir
          $app = (Get-ChildItem -LiteralPath $dir -Directory | Select-Object -First 1).FullName
          "app=$app" >> $env:GITHUB_OUTPUT

      # 사용자가 더블클릭하는 것과 같게 cmd로 실행한다. PATH를 시스템 폴더만 남기고 비운다 — uv·파이썬이 없는 PC와 같은 조건이다.
      # 러너에서 기록기를 띄울 필요는 없어서 등록까지만 한다(--no-start).
      - name: 설치 시험 — install.cmd 실행(uv·파이썬 없이)
        shell: cmd
        working-directory: ${{ steps.unpack.outputs.app }}
        run: |
          set PATH=%SystemRoot%\System32;%SystemRoot%\System32\WindowsPowerShell\v1.0
          call install.cmd --no-start < NUL
          if errorlevel 1 exit /b 1

      # 번들 안의 모든 모듈이 번들의 파이썬으로 불러와지는지(누락된 의존성·경로 설정 오류를 잡는다), 창을 소유할 실행 파일이 이름을 바꾼 것인지 본다.
      - name: 설치 시험 — 모듈 불러오기
        shell: cmd
        working-directory: ${{ steps.unpack.outputs.app }}
        run: |
          set PATH=%SystemRoot%\System32
          runtime\whatever-log-cli.exe -c "import launcher.__main__, desktop.__main__, hub.__main__, recorder.__main__, recorder.supervisor, sync_agent.__main__, sync_agent.supervisor, webview, psutil, keyring, filelock, clr_loader; import sys; print(sys.executable)"
          if errorlevel 1 exit /b 1
          if not exist runtime\whatever-log.exe exit /b 1
          if exist runtime\pythonw.exe exit /b 1
          if exist runtime\python.exe exit /b 1

      - name: 설치 시험 — 버전·상태 확인 후 제거
        shell: bash
        working-directory: ${{ steps.unpack.outputs.app }}
        env:
          PYTHONIOENCODING: utf-8
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          run() { PATH="/c/Windows/System32" ./runtime/whatever-log-cli.exe -m launcher "$@"; }
          expected="whatever.log ${VERSION}"
          version="$(run --version)"
          [ "$version" = "$expected" ] || { echo "버전이 달라요: '$version' (기대: '$expected')"; exit 1; }

          status="$(run status)"
          echo "$status"
          # 파이프 대신 <<<로 넘긴다 — pipefail에서 grep -q가 일찍 끝나면 앞쪽이 SIGPIPE로 실패해 찾았어도 못 찾은 것으로 판정이 뒤집힐 수 있다(&& 검사는 거짓 통과가 된다).
          grep -q "(개발)" <<<"$status" && { echo "번들인데 개발용 저장소로 인식했어요(release.json)"; exit 1; }
          # 자동 시작 대상의 개수는 세지 않는다(알림 에이전트가 늘었을 때 여기서 멈췄다) — 등록되지 않은 것이 하나도 없고, 등록된 것이 있으면 된다.
          grep -q '자동 시작 등록 안 됨' <<<"$status" && { echo "자동 시작에 등록되지 않은 구성 요소가 있어요"; exit 1; }
          grep -q '자동 시작 등록됨' <<<"$status" || { echo "자동 시작에 등록된 구성 요소가 없어요"; exit 1; }
          grep -q "runtime.whatever-log-cli.exe" <<<"$status" || { echo "번들 안의 파이썬으로 실행되지 않았어요"; exit 1; }

          run uninstall
          after="$(run status)"
          if grep -q '자동 시작 등록됨' <<<"$after"; then echo "$after"; echo "uninstall 뒤에도 자동 시작이 남아 있어요"; exit 1; fi

      # 설치 시험을 통과한 zip만 다음 job(Release 올리기)에 넘긴다.
      - name: 번들 넘기기
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: ${{ steps.build.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}

  # 저장소 쓰기 권한은 이 job에만 있다. 체크아웃·프로젝트 코드·서드파티 액션 없이 공식 아티팩트 내려받기와 gh만 쓴다 —
  # 번들 job의 코드나 액션이 쓰기 토큰을 쥐지 않게.
  publish:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist

      - name: GitHub Release 올리기
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: |
          archive="$(ls dist/*.zip)"
          flags=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" "$archive" $flags \
            --repo "${GITHUB_REPOSITORY}" \
            --title "whatever.log ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "설치: zip을 풀고 install.cmd를 실행하세요(uv·파이썬은 따로 필요 없어요). SHA-256: ${SHA256}"
